<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dusk Drift</title>
<meta name="description" content="Dusk Drift: a one-thumb arcade game. Steer a firefly, catch seeds, dodge stones.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:100%;max-height:760px;aspect-ratio:360/560;max-width:100%}

#ov h1{font-size:44px;line-height:1;margin:0;font-weight:800;letter-spacing:-1px}
#ov p{margin:0;color:var(--muted);font-size:16px;max-width:260px;line-height:1.4}
#ov b{color:var(--ink)}
button{font:inherit;font-weight:800;font-size:18px;background:var(--glow);color:#10231f;border:0;border-radius:999px;padding:14px 36px;margin-top:8px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#sw{display:flex;gap:10px;margin-top:2px}
#sw button.sw{width:34px;height:34px;padding:0;margin:0;border-radius:50%;border:3px solid transparent;background:var(--c)}
#sw button.sw.on{border-color:var(--ink)}
#mu{position:absolute;z-index:2;left:10px;bottom:10px;margin:0;padding:6px 12px;font-size:13px;font-weight:500;background:rgba(243,236,255,.16);color:var(--ink)}

#ap{position:absolute;inset:0;z-index:3;background:rgba(18,12,32,.96);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:16px;gap:6px;overflow:auto}
#ap h2{margin:0 0 2px;font-size:24px}

.ar{text-align:left;font-size:13px;padding:5px 10px;border-radius:10px;background:rgba(243,236,255,.06);opacity:.45}
.ar.on{opacity:1;background:rgba(255,200,87,.14)}
.ar b{display:block}.ar span{color:var(--muted);font-size:11px}
#np{position:absolute;inset:0;z-index:3;background:rgba(18,12,32,.96);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}

#nw{color:var(--rock)!important;min-height:1em}

</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="560"></canvas>
<div id="ov">
<h1 id="t">Dusk Drift</h1>
<p id="m">Slide to steer the firefly. Catch the <b style="color:var(--seed)">gold seeds</b>, dodge the <b style="color:var(--rock)">falling stones</b>. Chain catches to multiply your score. Grab power-ups for bonus points.</p>
<p id="s"></p>
<p>Firefly color</p>
<div id="sw"></div>
<p id="hf" style="font-size:13px"></p>
<button id="go">Play</button>
<button id="ab" class="alt">Achievements</button>
</div>
<button id="mu" aria-pressed="true">Music on</button>
<div id="np" class="hide"><h2>3000 points!</h2><p>Type a name to join the Legends shown on the start screen. Keep it friendly.</p><input id="ni" maxlength="12" placeholder="Your name" autocomplete="off"><p id="nw"></p><div class="row"><button id="nb">Save name</button><button id="ns" class="alt">Skip</button></div></div>
<div id="ap" class="hide"><h2>Achievements</h2><div id="al"></div><button id="ac" class="alt">Close</button></div>
</div>

var ab=document.getElementById('ab'),ap=document.getElementById('ap'),al=document.getElementById('al'),ac2=document.getElementById('ac');
function achLabel(){ab.textContent='Achievements '+Object.keys(done).length+'/'+ACH.length}
function ach(id){if(done[id])return;done[id]=1;try{localStorage.setItem('duskdrift-ach',JSON.stringify(done))}catch(e){}

ab.onclick=showAch;ac2.onclick=function(){ap.classList.add('hide')};achLabel();
function pop(px,py,txt,c){pops.push({x:px,y:py,txt:txt,c:c,l:45})}

add()}

function drawBin(o){x.save();x.translate(o.x,o.y);x.font='700 '+Math.round(o.r*2.2)+'px "Courier New",monospace';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#ff6b8a';x.shadowBlur=10;x.fillStyle='#ff6b8a';x.fillText(o.bin,0,0);x.restore()}
var st='ready',p,items,score,lives,combo,spawn,t,speed,tx,keys={},stars=[],trail=[];
for(var i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.6,r:Math.random()*1.4+.3,s:Math.random()*.4+.1});
function reset(){p={x:W/2,y:H-70};tx=p.x;items=[];score=0;lives=3;combo=0;spawn=0;t=0;speed=2;trail=[];walls=0;pows=0;pops=[];hitRun=false;wallTimer=90;warned=false;PW=W;splitT=0;splitOn=false;binOn=false;binTimer=300;wowShown=false;bigT=0;ph1=false;ph2=false;enemyTimer=50;asked=false}
function start(){musicStart();reset();st='play';ov.classList.add('hide')}
function end(){
chk();st='over';achLabel();
var nb=score>best;if(nb){best=score;try{localStorage.setItem('duskdrift-best',best)}catch(e){}}
T.textContent=nb?'New best!':'Lights out';
M.textContent='You scored '+score+'.';
S.textContent='Best: '+best;
go.textContent='Play again';ov.classList.remove('hide')}
go.onclick=start;
function pos(e){var r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',pos);cv.addEventListener('pointermove',pos);
addEventListener('keydown',function(e){if(st==='name')return;keys[e.key]=1;if(e.key==='m')toggleMusic();if((e.key==='Enter'||e.key===' ')&&st!=='play')start()});
addEventListener('keyup',function(e){keys[e.key]=0});
function add(){var seed=Math.random()<.55,o={x:Math.random()*(PW-50)+25,y:-30,seed:seed,kind:seed?'seed':'rock',rot:0,rv:.05,v:speed*(.8+Math.random()*.5)},i,n;
if(seed){o.r=9}else{
o.r=15+Math.random()*8;o.type=Math.floor(Math.random()*4);o.rv=(Math.random()-.5)*.07;o.h=250+Math.random()*90;o.l=36+Math.random()*10;o.sx=1;o.sy=1;o.pts=[];
if(o.type===0){n=7+Math.floor(Math.random()*3);for(i=0;i<n;i++)o.pts.push([i/n*6.283,.72+Math.random()*.38]);o.cr=[];for(i=0;i<3;i++)o.cr.push([Math.random()-.5,Math.random()-.5,(Math.random()-.5)*1.6,(Math.random()-.5)*1.6])}
else if(o.type===1){n=7;o.sx=1.35;o.sy=.62;for(i=0;i<n;i++)o.pts.push([i/n*6.283,.88+Math.random()*.18])}
else if(o.type===2){n=8;for(i=0;i<n;i++)o.pts.push([i/n*6.283-1.57,i%2?.5:(i%4?1.05:1.3)]);o.sx=.75}
else{n=14;for(i=0;i<n;i++)o.pts.push([i/n*6.283,.94+Math.random()*.1]);o.sp=[];for(i=0;i<7;i++)o.sp.push([Math.random()-.5,Math.random()-.5,.05+Math.random()*.09])}}
if(!seed&&binOn)o.bin=Math.random()<.5?'0':'1';items.push(o)}
function upd(){
t++;speed=2+Math.min(t/2400,2.2);
if(keys.ArrowLeft||keys.a)tx-=7;if(keys.ArrowRight||keys.d)tx+=7;
tx=Math.max(16,Math.min(PW-16,tx));
p.x+=(tx-p.x)*.25;
trail.push({x:p.x,y:p.y,a:1});if(trail.length>14)trail.shift();
if(--spawn<=0){spawnOne();spawn=Math.max(22,40-t/150)}
chk();
var ph=score>=1000&&score<1150;
if(score>=750&&!wowShown){wowShown=true;bigTxt='Wow!';bigT=110}
if(ph&&!ph1){ph1=true;items=items.filter(function(q){return q.kind!=='wall'});toasts.push('Walls gone: enemies incoming!')}
if(score>=1150&&ph1&&!ph2){ph2=true;toasts.push('Back to normal')}
if(ph&&--enemyTimer<=0){items.push({kind:'enemy',bx:Math.random()*(PW-80)+40,x:PW/2,y:-20,r:13,v:speed*.8,p0:Math.random()*6,amp:25+Math.random()*30,rot:0,rv:0});enemyTimer=50}
if(score>=1250){if(!splitOn){splitOn=true;items=items.filter(function(q){return q.kind!=='wall'&&q.x<=W/2+10});toasts.push('The screen is cut in half!')}
splitT=Math.min(1,splitT+.02);PW=W-W/2*(splitT*splitT*(3-2*splitT));
if(--binTimer<=0){binOn=!binOn;binTimer=binOn?400:540}}
if(score>=1500&&!cos){cos=Math.random()<.5?'crown':'rainbow';try{localStorage.setItem('duskdrift-cos',cos)}catch(e){}toasts.push('Unlocked: '+(cos==='crown'?'a crown':'rainbow firefly'))}
if(score>=3000&&!named&&!asked){asked=true;st='name';np.classList.remove('hide');nw.textContent='';ni.value='';ni.focus()}
if(score>=500){if(!warned){warned=true;toasts.push('Walls incoming: find the gap')}
if(--wallTimer<=0&&!ph&&!items.some(function(q){return q.kind==='wall'})){var gw=Math.max(84,124-(score-500)/30);items.push({kind:'wall',gw:gw,gx:10+Math.random()*(PW-gw-20),y:-14,v:speed*.85,r:0,rot:0,rv:0});wallTimer=330+Math.random()*240}}
for(var i=items.length-1;i>=0;i--){var o=items[i];o.y+=o.v;o.rot+=o.rv||0;
if(o.kind==='enemy')o.x=Math.max(14,Math.min(PW-14,o.bx+Math.sin(o.y/35+o.p0)*o.amp));
if(o.kind==='wall'){
if(!o.done&&Math.abs(o.y-p.y)<9){o.done=1;if(p.x-8<o.gx||p.x+8>o.gx+o.gw){if(hurt())return}else walls++}
if(o.y>H+20)items.splice(i,1);continue}
var dx=o.x-p.x,dy=o.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
if(d<o.r+11){
var k=o.kind;
if(k==='seed'){combo=Math.min(combo+1,5);score+=combo;ach('first')}
else if(k==='pow'){score+=o.val;pows++;pop(o.x,o.y,'+'+o.val,'#ffc857');if(o.val===30)ach('big')}
else if(k==='heart'){if(lives<3)lives++;pop(o.x,o.y,'+1 life','#ff4d6d');ach('heart')}
else if(hurt())return;
items.splice(i,1);continue}
if(o.y>H+30){if(o.kind==='seed')combo=0;items.splice(i,1)}}}
function glow(px,py,r,c){var g=x.createRadialGradient(px,py,0,px,py,r*3);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r*3,0,7);x.fill()}
function draw(){
x.clearRect(0,0,W,H);fr++;x.drawImage(bg,0,0);
x.fillStyle='#f3ecff';
stars.forEach(function(q){x.globalAlpha=.3+.7*Math.abs(Math.sin(fr*q.s*.05+q.x));x.fillRect(q.x,q.y,q.r,q.r)});
x.globalAlpha=1;
for(var m=0;m<3;m++){var mx=(fr*(.15+m*.1))%(W+240)-120;x.save();x.translate(mx,H-120+m*24);x.scale(2.2,.28);
var mgr=x.createRadialGradient(0,0,0,0,0,110);mgr.addColorStop(0,'rgba(190,170,230,.16)');mgr.addColorStop(1,'rgba(190,170,230,0)');
x.fillStyle=mgr;x.beginPath();x.arc(0,0,110,0,7);x.fill();x.restore()}
if(col){x.fillStyle='rgba('+col.rgb+',.3)';motes.forEach(function(q){q.y-=q.v;if(q.y<0)q.y=H;q.x+=Math.sin(fr*.02+q.ph)*.3;x.beginPath();x.arc(q.x,q.y,1.6,0,7);x.fill()})}
if(!p)return;
trail.forEach(function(q,i){x.globalAlpha=i/trail.length*.4;x.fillStyle=cos==='rainbow'?'hsl('+(fr*4-i*14)+',90%,65%)':col.hex;x.beginPath();x.arc(q.x,q.y+ (trail.length-i)*2,5*i/trail.length,0,7);x.fill()});
x.globalAlpha=1;
items.forEach(function(o){
if(o.seed){glow(o.x,o.y,o.r,'rgba(255,200,87,.5)');x.fillStyle='#ffc857';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()}
else if(o.kind==='wall')drawWall(o);else if(o.kind==='pow')drawPow(o);else if(o.kind==='heart')drawHeart(o);else if(o.kind==='enemy')drawEnemy(o);else drawRock(o)});
glow(p.x,p.y,11,fcol(.55));
x.fillStyle=fcol(1);x.beginPath();x.arc(p.x,p.y,8,0,7);x.fill();
x.fillStyle='#1d1530';x.beginPath();x.arc(p.x+2,p.y-2,2,0,7);x.fill();if(cos==='crown')drawCrown(p.x,p.y);
if(splitT>0){x.fillStyle='rgba(5,3,12,'+(.88*splitT)+')';x.fillRect(PW,0,W-PW,H);x.save();x.shadowColor='#f3ecff';x.shadowBlur=14;x.fillStyle='#f3ecff';x.fillRect(PW-1.5,0,3,H*Math.min(1,splitT*1.6));x.restore()}
if(bigT>0){bigT--;x.save();x.globalAlpha=Math.max(0,Math.min(1,bigT/30,(110-bigT)/10));x.font='800 72px "Bricolage Grotesque",system-ui,sans-serif';x.textAlign='center';x.shadowColor='#ffc857';x.shadowBlur=24;x.fillStyle='#ffc857';x.fillText(bigTxt,PW/2,H/2-40);x.restore()}
pops=pops.filter(function(q){return q.l>0});
pops.forEach(function(q){q.l--;q.y-=.8;x.save();x.globalAlpha=Math.min(1,q.l/25);x.fillStyle=q.c;x.font='800 18px "Bricolage Grotesque",system-ui,sans-serif';x.textAlign='center';x.fillText(q.txt,q.x,q.y);x.restore()});
x.fillStyle='#f3ecff';x.font='800 34px "Bricolage Grotesque",system-ui,sans-serif';x.textAlign='left';x.fillText(score,18,48);
if(combo>1){x.fillStyle='#ffc857';x.font='800 16px "Bricolage Grotesque",system-ui,sans-serif';x.fillText('x'+combo+' chain',18,70)}
x.textAlign='right';x.fillStyle='#ff6b8a';x.font='22px system-ui';x.fillText('\u2665'.repeat(Math.max(lives,0)),W-18,44);
x.fillStyle='#9a8bbd';x.font='500 13px "Bricolage Grotesque",system-ui,sans-serif';x.fillText('Best '+best,W-18,66);drawToast()}
(function loop(){if(st==='play')upd();draw();requestAnimationFrame(loop)})();
buildBg();reset();loadLegends();
})();
</script>
</body>
